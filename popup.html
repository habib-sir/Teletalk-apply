<!--
  Project: BD Job Autofill
  Module: Popup UI
  Purpose: Primary interface for selecting a profile, triggering autofill,
           and navigating to profile/application management views.
  Author: Lead Engineer
  Version: 1.0.0
  Dependencies: popup.css, popup.js
  Last Updated: 2026-07-06
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BD Job Autofill</title>
  <link rel="stylesheet" href="popup.css" />
  <script src="chrome-polyfill.js"></script>
</head>
<body>
  <main class="popup" role="main">
    <header class="popup__header">
      <h1 class="popup__title">BD Job Autofill</h1>
    </header>

    <section class="popup__section" aria-labelledby="profile-heading">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 id="profile-heading" class="popup__section-title">Profile</h2>
        <button id="delete-popup-profile-btn" type="button" title="Delete active profile" style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; font-size: 11px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; transition: background 0.15s;">
          <span>🗑️</span> Remove
        </button>
      </div>
      <div id="popup-delete-confirm-box" style="display: none; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 6px; padding: 8px 10px; margin: 6px 0; font-size: 12px; color: #9f1239;">
        <div style="margin-bottom: 6px;">Delete <strong id="popup-delete-name"></strong>?</div>
        <div style="display: flex; gap: 6px;">
          <button id="popup-delete-confirm-btn" type="button" style="background: #e11d48; color: #fff; border: none; border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer;">Yes, Delete</button>
          <button id="popup-delete-cancel-btn" type="button" style="background: #fff; color: #374151; border: 1px solid #d1d5db; border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer;">Cancel</button>
        </div>
      </div>
      <label class="popup__label" for="profile-select">Active profile</label>
      <div style="margin-bottom: 6px; position: relative;">
        <input 
          type="text" 
          id="popup-profile-search" 
          placeholder="🔍 Quick filter (name or mobile)..." 
          style="width: 100%; box-sizing: border-box; font-size: 11px; padding: 4px 8px; border: 1px solid var(--color-border, #cbd5e1); border-radius: 4px; background: #fff;"
          autocomplete="off"
        />
      </div>
      <select id="profile-select" class="popup__select" aria-describedby="profile-empty-hint"></select>
      <div id="popup-media-badges" style="display: flex; gap: 8px; margin-top: 6px; font-size: 11px;"></div>
      <p id="profile-empty-hint" class="popup__hint" hidden>No profiles saved yet.</p>
    </section>

    <section class="popup__section" aria-labelledby="sections-heading">
      <h2 id="sections-heading" class="popup__section-title">Education sections</h2>
      <p class="popup__hint">
        Useful for a 2nd-time autofill: uncheck a section to leave it untouched
        (e.g. fill Masters only, without overwriting Graduation).
      </p>
      <label class="popup__checkbox-row">
        <input type="checkbox" id="fill-gra-checkbox" checked />
        <span>Fill Graduation</span>
      </label>
      <label class="popup__checkbox-row">
        <input type="checkbox" id="fill-mas-checkbox" checked />
        <span>Fill Masters</span>
      </label>
    </section>

    <section class="popup__section" aria-labelledby="action-heading">
      <h2 id="action-heading" class="popup__section-title">Actions</h2>
      <button id="autofill-btn" class="popup__button popup__button--primary" type="button">
        Autofill this page
      </button>
      <p id="autofill-status" class="popup__status" role="status" aria-live="polite"></p>
    </section>

    <nav class="popup__nav" aria-label="Manage">
      <button id="manage-profiles-btn" class="popup__button popup__button--secondary" type="button">
        Manage Profiles
      </button>
      <button id="manage-applications-btn" class="popup__button popup__button--secondary" type="button">
        Track Applications
      </button>
      <button id="phone-sms-btn" class="popup__button popup__button--secondary" type="button" style="border-color: #86efac; background: #f0fdf4; color: #166534;">
        📱 Phone SMS Sync
      </button>
    </nav>
  </main>

  <!-- Toast Notification Overlay -->
  <div id="toast" class="toast" aria-hidden="true" hidden>
    <div class="toast__content">
      <header class="toast__header">
        <div class="toast__title-wrapper">
          <span class="toast__icon">✓</span>
          <h3 class="toast__title">Autofill Successful!</h3>
        </div>
        <button id="toast-close-btn" class="toast__close" type="button" aria-label="Close toast">×</button>
      </header>
      <div class="toast__body">
        <p class="toast__summary">Successfully filled <strong id="toast-count">0</strong> fields:</p>
        <div id="toast-list" class="toast__list">
          <!-- Dynamically populated filled fields and values -->
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
